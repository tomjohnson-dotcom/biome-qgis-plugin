<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" fill="none">
  <!-- Hairline ring with cardinal ticks -->
  <circle cx="50" cy="64" r="33" stroke="#C5900D" stroke-width="1.3" fill="none" opacity="0.5"/>
  <g stroke="#C5900D" stroke-width="1.3" opacity="0.5" stroke-linecap="round">
    <line x1="50" y1="25" x2="50" y2="31"/>
    <line x1="50" y1="97" x2="50" y2="103"/>
    <line x1="11" y1="64" x2="17" y2="64"/>
    <line x1="83" y1="64" x2="89" y2="64"/>
  </g>
  <!-- Split needle: gold right, ink left, meeting on the vertical axis -->
  <path d="M50 32 L58 64 L50 60 Z" fill="#C5900D"/>
  <path d="M50 32 L42 64 L50 60 Z" fill="#23292400"/>
  <path d="M50 32 L42 64 L50 60 Z" fill="#232924"/>
  <!-- South tail, hollow -->
  <path d="M50 96 L58 64 L50 68 Z" fill="#E8E2D2"/>
  <path d="M50 96 L42 64 L50 68 Z" fill="#F4EFE2"/>
  <!-- center pivot -->
  <circle cx="50" cy="64" r="2.4" fill="#232924"/>
  <!-- N -->
  <text x="50" y="18" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#232924" text-anchor="middle">N</text>
</svg>
