<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#5B4FA0" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="43" fill="#5B4FA0"/>

  <!-- Pitched (gable) roof of clay tiles with one tile missing — a dark roost
       gap — and the slipped tile resting on the eaves below. A Potential Roost
       Feature: the roof silhouette reads clearly even as a small map marker,
       so it no longer looks like a tree when zoomed out. -->

  <!-- roof slope + eaves fascia -->
  <path d="M50 23 L81 53 L19 53 Z" fill="#FFFFFF"/>
  <rect x="17" y="53" width="66" height="7" rx="2.5" fill="#FFFFFF"/>

  <!-- tile courses (seams) and a few staggered joints -->
  <path d="M28 44 L72 44 M38 35 L62 35" stroke="#5B4FA0" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 44 L50 35 M33 53 L33 44.5 M67 53 L67 44.5" stroke="#5B4FA0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- the missing tile: a dark roost void with a broken (jagged) top edge -->
  <path d="M40 53 L40 46 L44 44 L48 47 L50 44.5 L52 47 L56 44 L60 46 L60 53 Z" fill="#211B3E"/>

  <!-- the slipped tile, leaning on the eaves beside the gap -->
  <rect x="-6" y="-4" width="12" height="8" rx="2.5" fill="#FFFFFF"
        stroke="#5B4FA0" stroke-width="1.3" transform="translate(64 58) rotate(20)"/>
</svg>
