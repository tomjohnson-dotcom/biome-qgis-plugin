<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#44535E" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="43" fill="#44535E"/>

  <!-- handheld thermal camera body -->
  <rect x="20" y="44" width="42" height="26" rx="5" fill="#FFFFFF"/>
  <!-- pistol grip -->
  <path d="M28 70 h9 l-2 12 h-5 z" fill="#FFFFFF"/>
  <!-- thermal lens: white ring with dark core -->
  <circle cx="34" cy="57" r="10" fill="#44535E"/>
  <circle cx="34" cy="57" r="9" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="34" cy="57" r="3" fill="#FFFFFF"/>
  <!-- heat / IR waves radiating from the sensor (top-right) -->
  <path d="M62 34 q7 3 4 11" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M70 30 q10 5 6 17" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
</svg>
