name: Publish Biome update

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: biome-main-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto any newer main-branch push
        run: git pull --rebase origin main

      - name: Build a uniquely versioned QGIS update
        id: version
        shell: bash
        run: |
          base="$(tr -d '[:space:]' < release_base_version.txt)"
          version="${base}.${GITHUB_RUN_NUMBER}"
          python build_release.py --version "$version" --archive-name biome-latest.zip
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit the update catalogue and package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biome/metadata.txt plugins.xml releases/biome-latest.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Biome ${{ steps.version.outputs.version }} [skip publish]"
          git push origin HEAD:main
